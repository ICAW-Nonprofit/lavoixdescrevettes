name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # every morning: the "next action" rolls over, and the backup copy of the actions is refreshed
  schedule:
    - cron: '0 4 * * *'
  # also called by Supabase whenever an organiser saves an action (see supabase/migrations/*_automation.sql)
  workflow_dispatch:

permissions:
  contents: write # to commit the backup copy of the actions (src/content/events.json)
  pages: write
  id-token: write

# a burst of saves queues at most one extra build
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `npm run build` first copies the actions, campaign links and published blog posts from Supabase into
      # src/content/events.json, campaigns.json and posts.json, and the posts' cleaned images into src/assets/blog-media/
      - uses: withastro/action@v6
        with:
          node-version: 24
      - name: Keep the backup copy of the actions, campaign links and blog posts
        if: github.event_name != 'push'
        run: |
          BACKUP="src/content/events.json src/content/campaigns.json src/content/posts.json src/assets/blog-media"
          if [ -z "$(git status --porcelain -- $BACKUP)" ]; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $BACKUP
          git commit -m "Backup copy of the actions from Supabase"
          git pull --rebase --autostash && git push || echo "::warning::Could not push the backup copy (will retry next build)."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
