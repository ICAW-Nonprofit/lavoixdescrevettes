name: Database (Supabase)

# Tests the SQL, then applies new files from supabase/migrations to the Supabase database.
# Needs the repository secret SUPABASE_DB_URL (Supabase → Connect → "Session pooler" URI, with the password).
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test the SQL (in-memory Postgres)
        run: npm run test:db
      - name: Apply new migrations
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL is not set yet: nothing applied."
            exit 0
          fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          create table if not exists public._lvdc_migrations (name text primary key, applied_at timestamptz not null default now());
          alter table public._lvdc_migrations enable row level security; -- not readable through the API
          SQL
          for f in supabase/migrations/*.sql; do
            name=$(basename "$f")
            done=$(psql "$SUPABASE_DB_URL" -tA -c "select 1 from public._lvdc_migrations where name = '$name'")
            if [ "$done" = "1" ]; then echo "already applied: $name"; continue; fi
            echo "applying: $name"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f "$f" \
              -c "insert into public._lvdc_migrations (name) values ('$name')"
          done
